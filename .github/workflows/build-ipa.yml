name: 出 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    # ⬆️ macos-26 = Xcode 26.x（26.0.1 / 26.1.1 / 26.2 默认 / 26.3 / 26.4），SDK 含 iOS 26.0~26.2
    #    之前是 macos-15 = Xcode 16.4 / iOS 18.5 SDK —— 所以 LiquidGlass 只能用「手搓版」，
    #    系统的 glassEffect() / GlassEffectContainer 直接编译不过（unknown modifier / no member）
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # 钉死 Xcode 版本，别跟着 runner 的默认漂
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: 确认工具链
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "SDK  : $(xcrun --sdk iphoneos --show-sdk-version)"
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: 滚动内核 Swift↔JS 对拍
        run: |
          # 读渲染层从 WebView 迁到 Swift，滚动内核（章节窗口裁剪 / 进度节流 /
          # 视口锚点）也一并翻成了 Swift。
          # 这里做**真对拍**：JS 原版跑一批用例生成期望值 → Swift 版跑同一批 → 比。
          set -e
          mkdir -p test/fixtures
          node test/scroll-core-cases.js --emit > test/fixtures/scroll-core-cases.json
          node test/scroll-core-cases.js
          swiftc -O test/scroll-core-parity.swift \
                 QiReaderLite/Features/Reader/Paging/ReaderScrollCore.swift \
                 -o /tmp/scroll-core-parity
          /tmp/scroll-core-parity .

      - name: 编译
        run: |
          # || true 只为让脚本能往下走到打印错误那步
          # ⚠️ ENABLE_BITCODE 在 Xcode 16 起已被彻底移除，别再传（传了也是未知 setting）
          # ⭐⭐⭐ **注入引擎的真实 revision**（2026-10-25 真机教训）
          #   之前 App 界面里的引擎 revision 是**手写**的 ⇒ 显示的跟真在跑的不一致
          #   ⇒ 自证是假的 ⇒ 把排查带偏了 ⇒ 现在从 checkout 日志里**抓真值**注入 ⭐⭐⭐
          # ⭐⭐⭐ **只解析依赖，不编译**（2026-10-25 build254 实证踩过）
          #   ⚠️ 之前是「先编一次 ⇒ 生成文件 ⇒ 再编一次」
          #   ⇒ **第二次增量编译没重编那个文件** ⇒ 二进制里还是第一次的 "unknown" ⭐⭐⭐
          #   ⇒ 正解：**先 `-resolvePackageDependencies`**（只拉依赖，不编译 ⇒ 快）
          #   ⇒ 拿到 SPM checkout 出来的引擎目录 ⇒ 生成文件 ⇒ **然后只编译一次** ⭐⭐⭐
          # ⚠️⚠️ **必须用同一个 `-derivedDataPath`** ⇒ 否则 checkout 落在**另一个目录**
          #   ⇒ 后面 `git -C build/dd/SourcePackages/checkouts/legado-engine` 就找不到 ⭐⭐⭐
          xcodebuild -project QiReaderLite.xcodeproj -scheme QiReaderLite \
            -configuration Release -sdk iphoneos -derivedDataPath build/dd \
            -resolvePackageDependencies \
            > resolve.log 2>&1 || true
          # ⚠️ resolve 失败也要看得见（否则后面 revision 抓不到 ⇒ 显示 unknown）
          grep -E "error:|Checking out main" resolve.log | head -10 || true
          # ⭐⭐⭐ 抓引擎真实 revision（**直接读 SPM checkout 出来的引擎目录的 git HEAD**）
          #   ⚠️⚠️ **别去 grep `b.log`**（那句 `Checking out main (...)` 在 **SPM resolve 的输出**里
          #   ⇒ 不在 b.log ⇒ 抓不到 ⇒ 注入成了空值 ⇒ 二进制里显示 unknown）⭐⭐⭐
          ENG_DIR="build/dd/SourcePackages/checkouts/legado-engine"
          LEGADO_REV="$(git -C "$ENG_DIR" rev-parse --short=12 HEAD 2>/dev/null || true)"
          if [ -z "$LEGADO_REV" ]; then LEGADO_REV="unknown"; fi
          echo "注入的引擎 revision = $LEGADO_REV"
          # ⭐⭐⭐⭐⭐ **生成 revision 文件**（2026-10-25 真机教训 ⇒ 不用 `-D` 宏）
          #   ⚠️⚠️ **为什么不用 `-D`**：Swift 的条件编译标志**不带值**
          #     （`-DLEGADO_REVISION=xxx` ⇒ 告警 `flags do not have values in Swift`）⭐⭐⭐
          #   ⇒ 而且 `LegadoCore` 是 SPM 依赖 target ⇒ App 的 `OTHER_SWIFT_FLAGS` 传不进去 ⭐⭐⭐
          #   ⇒ **生成一个 Swift 文件**才是可靠通道（pbxproj 是同步 root group ⇒ 新文件自动进 target）⭐⭐⭐
          # ⭐⭐⭐ **用 python 生成**（不用 heredoc ⇒ 绕开 YAML 缩进/tab 的坑）⭐⭐⭐
          #   ⚠️ YAML 的 run 块里 heredoc 的缩进极难控制（tab 会被 yaml 处理）⇒ 别用 ⭐⭐⭐
          LEGADO_REV="$LEGADO_REV" python3 - <<'PYGEN'
          import os, pathlib
          rev = os.environ.get("LEGADO_REV", "unknown")
          p = pathlib.Path("QiReaderLite/Core/EngineRevision.generated.swift")
          p.write_text(
              "// ⭐⭐⭐⭐⭐ **引擎 revision（CI 生成 ⇒ 真值）** —— **不许手改**\n"
              "// ⚠️ 自动生成：CI 用「SPM checkout 出来的引擎目录的 git HEAD」覆写 ⭐⭐⭐\n"
              "enum EngineRevision {\n"
              "    /// ⭐ 真实 revision（CI 注入）\n"
              f"    static let generated: String = \"{rev}\"\n"
              "}\n",
              encoding="utf-8")
          print("--- 生成的内容 ---")
          print(p.read_text(encoding="utf-8"))
          PYGEN
          # ⭐⭐⭐ **只编译一次**（生成的文件在编译**之前**就位 ⇒ 一定会进二进制）⭐⭐⭐
          xcodebuild -project QiReaderLite.xcodeproj -scheme QiReaderLite \
            -configuration Release -sdk iphoneos -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build > b.log 2>&1 || true
          echo "===== 编译错误 ====="
          grep "error:" b.log | sort -u | head -40
          echo "===== 错误结束 ====="

      - name: 归档编译日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: b.log
          if-no-files-found: ignore

      - name: 打包
        run: |
          set -e
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          # 防呆：编译失败时 Xcode 会留下只有资源的空壳 .app，
          # 别再把它打成没有可执行文件的废 ipa
          if [ ! -f "$APP/QingYue" ]; then
            echo "!!! 构建产物不完整：缺可执行文件 QingYue !!!"
            tail -40 b.log
            exit 1
          fi
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cat > build/ipa/Payload/QingYue.app/embedded.mobileprovision <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Entitlements</key><dict/>
          <key>application-identifier</key><string>*</string>
          <key>com.apple.developer.team-identifier</key><string>*</string>
          <key>get-task-allow</key><false/>
          <key>keychain-access-groups</key><array><string>*</string></array>
          </dict></plist>
          PLIST
          ( cd build/ipa && zip -qry QingYue.ipa Payload )
          ls -la build/ipa/QingYue.ipa

          # ⭐⭐ 额外打一个【不含伪造描述文件】的包（给「全能签」）
          #   伪造的**通配符**描述文件（application-identifier = *）⇒ iOS 认它
          #   ⇒ 但「全能签」要拿用户证书去匹配 appid ⇒ 看到 * ⇒ 匹配不上
          #      ⇒ 报「未匹配到有效证书，请先导入证书」⭐
          #   ⇒ 这个版本**去掉**它 ⇒ 让签工具自己生成匹配真证书的描述文件
          #   （「证书全能签」两个版本都能用 ⇒ 保留原包，零回归）
          cp build/ipa/Payload/QingYue.app/embedded.mobileprovision /tmp/fake-provision.plist 2>/dev/null || true
          rm -f build/ipa/Payload/QingYue.app/embedded.mobileprovision
          ( cd build/ipa && zip -qry QingYue-noprov.ipa Payload )
          # 装回（后面还要用它）
          [ -f /tmp/fake-provision.plist ] && cp /tmp/fake-provision.plist build/ipa/Payload/QingYue.app/embedded.mobileprovision
          ls -la build/ipa/QingYue-noprov.ipa

      - name: 提交进仓库
        # Artifacts 在手机上下不动，改成把 ipa 直接 push 进仓库，
        # 从仓库页面就能下载，手机浏览器完全没问题。
        #
        # ⚠️ 强制从 main 取源码：之前在 ipa-build 分支上触发过一次，
        # 结果 checkout 到旧代码 → 编出旧 ipa → 推回 ipa-build，
        # 形成死循环，跑一百次还是旧包。这里钉死。
        if: always()
        run: |
          set +e
          git fetch origin main --depth=1 2>&1 | tail -2
          git checkout -B ipa-out origin/main 2>&1 | tail -2
          mkdir -p out
          if [ -f build/ipa/QingYue.ipa ]; then
            cp build/ipa/QingYue.ipa out/QingYue.ipa
          elif [ -f build/out.ipa ]; then
            cp build/out.ipa out/QingYue.ipa
          else
            echo "没有 ipa 可提交"; exit 0
          fi
          git config user.email "ci@local"
          git config user.name "ci"
          [ -f build/ipa/QingYue-noprov.ipa ] && cp build/ipa/QingYue-noprov.ipa out/QingYue-noprov.ipa
          git add -f out/QingYue.ipa out/QingYue-noprov.ipa
          git commit -q -m "ipa build ${{ github.run_number }}" || echo "(无变化)"
          # 推到独立分支 ipa-build，不碰 main ——
          # 否则用户本地仓库每次推送都要先 pull，白折腾
          git push -q origin HEAD:refs/heads/ipa-build --force 2>&1 | tail -3
          echo "下载地址: https://github.com/806927125/qireaderlite/blob/ipa-build/out/QingYue.ipa"
          echo "（全能签请用这个）: https://github.com/806927125/qireaderlite/blob/ipa-build/out/QingYue-noprov.ipa"

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QingYue-ipa
          path: build/ipa/*.ipa
          retention-days: 7
