<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>125 源 · 轻阅适配版 · 一键复制</title>
<style>
  :root{
    --bg:#f4f5f7; --card:rgba(255,255,255,.72); --line:rgba(0,0,0,.08);
    --ink:#1c1c1e; --sub:#8a8a8e; --blue:#0a68e8; --green:#1a9c5c;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#000;--card:rgba(28,28,30,.72);--line:rgba(255,255,255,.12);
          --ink:#f2f2f7;--sub:#98989f;--blue:#4c9bff;--green:#32d74b;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .wrap{max-width:820px;margin:0 auto;padding:16px}

  header{position:sticky;top:0;z-index:10;background:var(--bg);
         padding:12px 0 10px;margin-bottom:4px}
  h1{font-size:20px;margin:0 0 2px;font-weight:700}
  .meta{color:var(--sub);font-size:13px;margin-bottom:10px}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:150px;padding:10px 13px;border-radius:11px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);outline:none}
  button{font:inherit;font-weight:600;border:0;cursor:pointer;border-radius:11px;
    padding:10px 15px;background:var(--blue);color:#fff;white-space:nowrap}
  button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  button:active{opacity:.6}

  .item{background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:13px 15px;margin-bottom:9px;backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px)}
  .row{display:flex;align-items:center;gap:10px}
  .nm{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u{color:var(--sub);font-size:12px;margin-top:3px;overflow:hidden;
     text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--green);
       color:#fff;font-weight:600;margin-left:4px}
  .cp{font-size:13px;padding:7px 13px;border-radius:9px}
  details{margin-top:9px}
  summary{cursor:pointer;color:var(--sub);font-size:12.5px;user-select:none}
  pre{margin:8px 0 0;padding:11px;border-radius:10px;background:rgba(0,0,0,.055);
      font:11.5px/1.45 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;
      white-space:pre-wrap;word-break:break-all;max-width:100%}
  @media (prefers-color-scheme:dark){pre{background:rgba(255,255,255,.07)}}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);
    padding:12px 22px;border-radius:13px;font-weight:650;font-size:14.5px;
    transition:transform .26s cubic-bezier(.2,.9,.3,1);z-index:99;pointer-events:none}
  #toast.on{transform:translateX(-50%) translateY(0)}
  .none{text-align:center;color:var(--sub);padding:44px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>125 源 · 轻阅适配版</h1>
    <div class="meta">按名字或网址搜，点「复制」直接进剪贴板 → 粘贴到书源管理</div>
    <div class="bar">
      <input type="search" id="q" placeholder="搜书源名 / 网址…" autocomplete="off">
      <button class="ghost" id="copyAll">复制全部(带方括号)</button>
    </div>
  </header>
  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
let DATA = [];
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;render();})
                   .catch(e=>{document.getElementById('list').innerHTML=
                     '<div class="none">加载失败：'+e+'<br>直接下载 data.json 即可</div>';});

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1500);}

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    // WKWebView / 非 https 下 clipboard API 不可用，退回 execCommand
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let okd=false;
    try{ okd=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    return okd;
  }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const hit=DATA.filter(d=>!q||d.name.toLowerCase().includes(q)||d.url.toLowerCase().includes(q));
  document.getElementById('list').innerHTML = hit.length ? hit.map((d,i)=>`
    <div class="item">
      <div class="row">
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(d.name)}${d.chg.map(c=>'<span class="tag">'+c+'</span>').join('')}</div>
          <div class="u">${esc(d.url)}</div>
        </div>
        <button class="cp" data-i="${DATA.indexOf(d)}">复制</button>
      </div>
      <details><summary>先看看 JSON</summary>
        <pre>${esc(JSON.stringify(d.json,null,2))}</pre></details>
    </div>`).join('')
    : '<div class="none">没找到匹配的源</div>';

  document.querySelectorAll('.cp').forEach(b=>b.onclick=async()=>{
    const d=DATA[+b.dataset.i];
    const okd=await copy(JSON.stringify([d.json],null,2));
    toast(okd?'已复制 '+d.name:'复制失败，长按下面的 JSON 选中');
  });
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('copyAll').onclick=async()=>{
  const okd=await copy(JSON.stringify(DATA.map(d=>d.json),null,2));
  toast(okd?'已复制全部 125 个源':`复制失败，分批复制或用下载`);
};
</script>
</body>
</html>
