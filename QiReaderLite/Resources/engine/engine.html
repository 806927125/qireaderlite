<!--
  规则沙盒宿主页。这里没有 UI，也不会有任何东西被渲染到屏幕上 ——
  WKWebView 整个是隐藏的，SwiftUI 负责所有界面。
  这个页面存在的意义只是给 JS 一个安全上下文（能跑 DOMParser / XPath / eval）。

  刻意**不写 <script src>**：Xcode 对同步组里 .js/.html 的落盘位置
  （保目录结构 vs 展平到 bundle 根）在不同版本上不一致，
  一旦猜错就是「引擎永远不 ready」，首屏直接卡死，而且日志很难看出原因。
  改成由原生侧逐个把 JS 读出来注入，位置猜错也只会少一个文件、能明确报出缺哪个。
-->
</body>
