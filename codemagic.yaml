# Codemagic —— 云端 macOS 出包
#
# ⚠️ 格式说明：2026-10-18 从老式 `configs:` 迁到新式 `workflows:`。
#    老格式的 `distribution: manual` + `ios_method: development` 在新格式里
#    合并成一个字段：`distribution_type: development`（可选 app_store / ad_hoc / development / enterprise）。
#
# ⚠️ 证书只有一种放法，别混用（混用会报「找不到 p12」）：
#
#   方案 A（推荐）：网页端上传
#     codemagic.io → Team settings → Code signing → iOS certificates
#     传 .p12 + .mobileprovision，密码填那儿
#     → 保持本文件里 p12_file_path / provisioning_profile_path **注释掉**
#
#   方案 B：文件进仓库
#     把 development.p12 / development.mobileprovision 传到 ios-certificate/ 目录
#     → 取消下面那两行注释，并在 Codemagic 的环境变量里加 P12_PASSWORD
#     （注意 .gitignore 已排除 *.p12，传了也传不上去，得先去掉那行）
#
#   方案 C：完全免签（不需要任何证书）
#     用下面 build_unsigned_ipa 那个 workflow，走 GitHub Actions 也一样能免签出包
#
# 免费额度 500 分钟/月，一次构建 3~5 分钟。

name: 轻阅 Lite
type: app
platform: iOS

workflows:
  build_signed_ipa:
    name: 已签名 IPA
    instance_type: mac_mini_m2
    # ⬆️ Xcode 26.6 = Swift 6.3 + iOS 26 SDK → 系统的 glassEffect() / Liquid Glass 可用
    #    之前是 Xcode 16.4 / iOS 18.5 SDK，LiquidGlass 只能手搓
    xcode_version: "26.6"
    max_build_duration: 60

    environment:
      ios_signing:
        # 装自己手机用 development 或 ad_hoc；上 TestFlight / App Store 改 app_store
        distribution_type: development

        # ── 方案 A：注释掉这三行，走网页上传 ──
        # p12_file_path: "ios-certificate/development.p12"
        # p12_password: ${P12_PASSWORD}
        # provisioning_profile_path: "ios-certificate/development.mobileprovision"

        # ── bundle id 必须和 profile 里那个一字不差 ──
        # 不一致 → No profile matching 'xxx' found
        # 改这里的同时，要改 project.pbxproj 里的 PRODUCT_BUNDLE_IDENTIFIER
        bundle_identifier: com.qireaderlite.app

    settings:
      base:
        # ⚠️ 这几项别丢：xcodebuild 的显式设置会覆盖 pbxproj 里的值。
        #    版本号必须跟 pbxproj 一致，否则 Codemagic 编出来的包版本会跟 Actions 出的不一样。
        PRODUCT_BUNDLE_IDENTIFIER: com.qireaderlite.app
        # ⚠️ 版本号故意跟 Actions 出的不一样：
        #    Actions = macos-15 (Xcode 16.4) → 3.4，手搓版玻璃
        #    Codemagic = Xcode 26.6             → 3.5，系统 glassEffect 版
        #    两个包装机上能一眼分出哪个是 26 的 UI
        MARKETING_VERSION: "3.7"
        CURRENT_PROJECT_VERSION: "179"

    scripts:
      - name: 编译并签名
        script: |
          set -e
          xcodebuild \
            -project QiReaderLite.xcodeproj \
            -scheme QiReaderLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            -allowProvisioningUpdates \
            build

      - name: 核对签名
        script: |
          set -e
          APP="build/dd/Build/Products/Release-iphoneos/QingYue.app"
          test -d "$APP" || { echo "❌ 没找到 $APP"; exit 1; }
          echo "--- profile 名称 ---"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Name raw - 2>/dev/null || echo "(读不出，可能没签上)"
          echo "--- team / bundle id ---"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || true
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Authority" || true
          echo "--- 引擎文件是否进包 ---"
          ls "$APP" | head -30
          if [ -f "$APP/engine.html" ]; then
            echo "✅ engine.html 在 bundle 根"
          else
            echo "⚠️ engine.html 不在根目录，查 ResourcesLocator 的候选路径"
          fi

      - name: 组装 IPA
        script: |
          set -e
          APP="build/dd/Build/Products/Release-iphoneos/QingYue.app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "../QingYue-signed-$(date +%Y%m%d).ipa" Payload
          cd ../..
          echo "✅ build/QingYue-signed-$(date +%Y%m%d).ipa"

    artifacts:
      - build/*.ipa
      - build/dd/Logs/**/*.xcactivitylog

  build_unsigned_ipa:
    name: 免签 IPA（不需要证书）
    instance_type: mac_mini_m2
    # ⬆️ Xcode 26.6 = iOS 26 SDK → LiquidGlass.swift 里的系统 glassEffect() 会真的编进去
    xcode_version: "26.6"
    max_build_duration: 60

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qireaderlite.app
        MARKETING_VERSION: "3.7"
        CURRENT_PROJECT_VERSION: "179"

    scripts:
      - name: 编译（不签名）
        script: |
          set -e
          xcodebuild \
            -project QiReaderLite.xcodeproj \
            -scheme QiReaderLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > b.log 2>&1 || true
          echo "===== 编译错误 ====="
          grep "error:" b.log | sort -u | head -40
          echo "===== 错误结束 ====="

      - name: 组装 IPA
        script: |
          set -e
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          # 防呆：编译失败时 Xcode 会留下只有资源的空壳 .app，别打成废 ipa
          if [ ! -f "$APP/QingYue" ]; then
            echo "!!! 构建产物不完整：缺可执行文件 QingYue !!!"
            tail -40 b.log
            exit 1
          fi
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          # 免签包里塞一份空描述文件，装的时候才不会因为缺 embedded.mobileprovision 报错
          cat > build/ipa/Payload/QingYue.app/embedded.mobileprovision <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Entitlements</key><dict/>
          <key>application-identifier</key><string>*</string>
          <key>com.apple.developer.team-identifier</key><string>*</string>
          <key>get-task-allow</key><false/>
          <key>keychain-access-groups</key><array><string>*</string></array>
          </dict></plist>
          PLIST
          ( cd build/ipa && zip -qry QingYue.ipa Payload )
          ls -la build/ipa/QingYue.ipa

    artifacts:
      - build/ipa/*.ipa
