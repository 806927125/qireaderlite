<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>阅读设置面板（按 ui.txt 一比一）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#f5f1e4;color:#333;overflow:hidden;display:flex;flex-direction:column}

  /* === 严格按 ui.txt === */
  .reader{flex:1;padding:60px 28px 0;overflow:hidden;transition:background .3s,color .3s}
  .reader p{font-size:19px;line-height:2.1;margin-bottom:1.4em;text-align:justify}
  .reader .indent{text-indent:0}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.15);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:10}
  .mask.show{opacity:1;pointer-events:auto}

  .panel{position:fixed;left:14px;right:14px;bottom:14px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:22px;box-shadow:0 4px 30px rgba(0,0,0,.12);
    padding:12px 14px 16px;z-index:20;transform:translateY(0);
    transition:transform .3s cubic-bezier(.32,.72,.35,1)}
  .panel.hidden{transform:translateY(120%)}

  .row-fontsize{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
  .fs-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.05);
    border:none;font-size:14px;color:#555;cursor:pointer;flex-shrink:0}
  .fs-btn:active{background:rgba(0,0,0,.12)}

  .slider-wrap{flex:1;display:flex;align-items:center}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:6px;
    border-radius:3px;
    background:linear-gradient(to right,#4a90d9 var(--p,30%),rgba(0,0,0,.12) var(--p,30%));
    outline:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
    border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}

  .font-select{flex-shrink:0;display:flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.06);border:none;border-radius:18px;
    padding:7px 13px;font-size:14px;color:#333;cursor:pointer}

  .divider{height:1px;background:rgba(0,0,0,.07);margin:0 2px 10px}

  .theme-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0}
  .mode-icon{width:28px;font-size:17px;color:#888;text-align:center;flex-shrink:0}
  .swatches{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .swatches::-webkit-scrollbar{display:none}
  .swatch{width:42px;height:42px;border-radius:9px;border:2px solid transparent;
    flex-shrink:0;cursor:pointer;font-size:13px;
    display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .swatch:active{transform:scale(.92)}
  .swatch.active{border-color:#4a90d9;box-shadow:0 0 0 1px #4a90d9}

  .row-follow{display:flex;align-items:center;justify-content:space-between;
    padding:4px 2px 10px}
  .row-follow .label{display:flex;align-items:center;gap:8px;font-size:15px;color:#333}
  .row-follow .label .ic{font-size:18px;color:#777}

  .switch{position:relative;width:50px;height:29px;background:#d8d8d8;
    border-radius:15px;cursor:pointer;transition:background .25s;flex-shrink:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);
    transition:transform .25s}
  .switch.on{background:#4a90d9}
  .switch.on::after{transform:translateX(21px)}

  .row-pageturn{display:flex;align-items:center;gap:8px;padding:0 0 12px}
  .pt-icon{width:28px;font-size:17px;color:#888;text-align:center;flex-shrink:0}
  .pills{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex-shrink:0;padding:8px 17px;border-radius:18px;background:rgba(0,0,0,.06);
    border:none;font-size:14px;color:#333;cursor:pointer;transition:all .15s}
  .pill.active{background:#4a90d9;color:#fff}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 8px}
  .cell{background:rgba(0,0,0,.05);border:none;border-radius:12px;
    padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;
    gap:4px;cursor:pointer;transition:transform .15s}
  .cell:active{transform:scale(.94);background:rgba(0,0,0,.1)}
  .cell .ic{font-size:18px;color:#333;line-height:1}
  .cell .t1{font-size:13px;color:#222}
  .cell .t2{font-size:11px;color:#999;display:none}

  .fab{position:fixed;right:20px;bottom:24px;z-index:5;padding:12px 22px;
    border-radius:26px;border:none;background:#4a90d9;color:#fff;font-size:15px;
    box-shadow:0 4px 14px rgba(74,144,217,.4);cursor:pointer}
</style>
</head>
<body>

<div class="reader" id="reader">
  <p>"是啊！少阳哥他终于成功了……"</p>
  <p>"成功了，少阳哥成功觉醒了……"</p>
  <p>一旁的孩子也全都欢呼了起来。</p>
  <p class="indent">……</p>
  <p>欢呼声，让觉醒师瞬间从震惊中清醒了过来。</p>
  <p>"三少爷，您的武魂应该是属于本体武魂一类。接下来，还请收回武魂、来测试一下魂力。"</p>
  <p>说着，他递过了一个蓝色水晶球。</p>
  <p>听到他的话，现场瞬间安静了下来。</p>
</div>

<div class="mask show" id="mask"></div>

<div class="panel" id="panel">
  <div class="row-fontsize">
    <button class="fs-btn" id="fsMinus">小</button>
    <div class="slider-wrap"><input type="range" id="fsSlider" min="14" max="28" value="19" step="1"></div>
    <button class="fs-btn" id="fsPlus">大</button>
    <button class="font-select">系统字体 <span style="font-size:11px;color:#999">⌄</span></button>
  </div>
  <div class="divider"></div>
  <div class="theme-row"><div class="mode-icon">☀️</div><div class="swatches" id="lightSwatches"></div></div>
  <div class="theme-row"><div class="mode-icon">🌙</div><div class="swatches" id="darkSwatches"></div></div>
  <div class="row-follow">
    <div class="label"><span class="ic">◐</span>跟随系统深浅色</div>
    <div class="switch on" id="followSwitch"></div>
  </div>
  <div class="divider"></div>
  <div class="row-pageturn">
    <div class="pt-icon">📖</div>
    <div class="pills" id="ptPills"></div>
  </div>
  <div class="grid">
    <button class="cell"><span class="ic">大小</span><span class="t1">显示设置</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">☰</span><span class="t1">间距设置</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">🔊</span><span class="t1">朗读设置</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">🖊️</span><span class="t1">高亮设置</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">💬</span><span class="t1">气泡设置</span><span class="t2"></span></button>
    <button class="cell"><span class="ic" style="font-size:16px;font-weight:600">格式</span><span class="t1">标题样式</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">📄</span><span class="t1">页眉页脚</span><span class="t2"></span></button>
    <button class="cell"><span class="ic">⋯</span><span class="t1">更多设置</span><span class="t2"></span></button>
  </div>
</div>

<button class="fab" id="fab" style="display:none">打开设置</button>

<script>
  const reader=document.getElementById('reader'),
        panel=document.getElementById('panel'),
        mask=document.getElementById('mask'),
        fab=document.getElementById('fab');
  const slider=document.getElementById('fsSlider');
  function applyFontSize(v){
    v=Math.max(14,Math.min(28,v));
    slider.value=v;
    slider.style.setProperty('--p',((v-14)/14*100)+'%');
    reader.querySelectorAll('p').forEach(p=>p.style.fontSize=v+'px');
  }
  slider.addEventListener('input',e=>applyFontSize(+e.target.value));
  document.getElementById('fsMinus').onclick=()=>applyFontSize(+slider.value-1);
  document.getElementById('fsPlus').onclick=()=>applyFontSize(+slider.value+1);
  applyFontSize(19);

  const lightThemes=[
    {bg:'#ffffff',fg:'#333333'},{bg:'#e8f5e9',fg:'#2e4632'},
    {bg:'#fdf6e3',fg:'#5b4a2f'},{bg:'#f5f1e4',fg:'#333333'},
    {bg:'#eef3f8',fg:'#2f3a48'},{bg:'#1c1c1e',fg:'#cccccc'},
    {bg:'#e3f0fa',fg:'#2f3a48'},{bg:'#f3f5f7',fg:'#333333'}];
  const darkThemes=[
    {bg:'#14181d',fg:'#b8c0c8'},{bg:'#101525',fg:'#b0b8cc'},
    {bg:'#14211a',fg:'#b8c8be'},{bg:'#1a1a1a',fg:'#c8c8c8'},
    {bg:'#000000',fg:'#c8c8c8'},{bg:'#151515',fg:'#bcbcbc'},
    {bg:'#1c1a17',fg:'#c5bcb0'}];

  function buildSwatches(list,id){
    const box=document.getElementById(id);
    list.forEach((t,i)=>{
      const s=document.createElement('div');
      s.className='swatch';
      s.style.background=t.bg;
      s.style.color=t.fg;
      s.textContent='文';
      if(id==='lightSwatches'&&i===3)s.classList.add('active');
      s.onclick=()=>{
        document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
        s.classList.add('active');
        reader.style.background=t.bg;
        reader.style.color=t.fg;
        document.body.style.background=t.bg;
      };
      box.appendChild(s);
    });
  }
  buildSwatches(lightThemes,'lightSwatches');
  buildSwatches(darkThemes,'darkSwatches');

  document.getElementById('followSwitch').onclick=function(){this.classList.toggle('on')};

  const modes=['仿真','滑动','平移','无动画','上下滚动'];
  const pillBox=document.getElementById('ptPills');
  modes.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='pill'+(i===1?' active':'');
    b.textContent=m;
    b.onclick=()=>{
      pillBox.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
    pillBox.appendChild(b);
  });

  mask.onclick=()=>{panel.classList.add('hidden');mask.classList.remove('show');fab.style.display='block'};
  fab.onclick=()=>{panel.classList.remove('hidden');mask.classList.add('show');fab.style.display='none'};
</script>
</body>
</html>
